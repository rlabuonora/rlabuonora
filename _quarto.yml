project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "cursos/**/*.qmd"
    - "proyectos/**/*.qmd"
    - "posts/**/*.qmd"

website:
  title: "Rafael La Buonora"
  navbar:
    title: false
    left:
      - href: index.qmd
        text: Inicio
      - href: proyectos/index.qmd
        text: Proyectos
      - href: cursos/index.qmd
        text: Cursos
      - href: posts/index.qmd
        text: Posts
      - href: about.qmd
        text: Acerca

format:
  html:
    theme: cosmo
    css: styles/site.css
    include-in-header: includes/head.html
    include-after-body: includes/site-footer-body.html
    toc: false
    filters:
      - filters/content-layout.lua

# Future editorial model:
# - keep `content_type`, `access`, and `tier` in item front matter
# - add listing/pipeline logic so only `access: public` items are rendered publicly
# - tier can later drive homepage prominence and collection ordering
